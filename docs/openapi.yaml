openapi: 3.1.0
info:
  title: RepoMedic API
  version: 0.1.0
  description: Local API contract for guarded repair runs.
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service is live.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ready
