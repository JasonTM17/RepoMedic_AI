openapi: 3.1.0
info:
  title: RepoMedic API
  version: 0.1.0
  description: Local API contract for guarded repair runs.
servers:
  - url: http://localhost:4000
    description: Local development server
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /metrics:
    get:
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus metrics.
          content:
            text/plain:
              schema:
                type: string
                example: 'repomedic_api_info{service="api"} 1\n'
  /v1/repairs:
    post:
      operationId: createRepair
      summary: Diagnose a repository and create an approval-gated repair run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairRequest"
      responses:
        "201":
          description: Repair run created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: listRepairs
      summary: List in-memory repair runs.
      responses:
        "200":
          description: Repair runs ordered by most recent update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairListResponse"
  /v1/repairs/{repairId}:
    get:
      operationId: getRepair
      summary: Read one repair run.
      parameters:
        - $ref: "#/components/parameters/RepairId"
      responses:
        "200":
          description: Repair run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairRun"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/repairs/{repairId}/approval:
    post:
      operationId: decideRepairApproval
      summary: Approve or reject an awaiting repair proposal.
      parameters:
        - $ref: "#/components/parameters/RepairId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Updated repair run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  parameters:
    RepairId:
      name: repairId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Requested repository root is outside the configured scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested repair run does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The repair run is not awaiting an approval decision.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ready
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true
    RepairRequest:
      type: object
      additionalProperties: false
      required: [issueDescription]
      properties:
        issueDescription:
          type: string
          minLength: 1
          maxLength: 4000
        rootPath:
          type: string
          minLength: 1
        allowlist:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 260
          default: ["."]
        backend:
          type: string
          enum: [fake, openai]
          default: fake
        maxRetries:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        dryRun:
          type: boolean
          default: false
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        reason:
          type: string
          maxLength: 1000
    RepositoryTarget:
      type: object
      required: [rootPath]
      properties:
        rootPath:
          type: string
        gitHead:
          type: string
        branch:
          type: string
    DiagnosisIssue:
      type: object
      required: [id, severity, confidence, description, evidence, relatedFiles]
      properties:
        id:
          type: string
        file:
          type: string
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        description:
          type: string
        evidence:
          type: array
          items:
            type: string
        relatedFiles:
          type: array
          items:
            type: string
    PatchOperation:
      type: object
      required: [id, path, kind]
      properties:
        id:
          type: string
        path:
          type: string
        kind:
          type: string
          enum: [create, modify, delete, rename, chmod]
        oldSha:
          type: string
        newSha:
          type: string
        hunks:
          type: array
          items:
            type: string
        mode:
          type: integer
          minimum: 0
    PatchProposal:
      type: object
      required: [id, target, operations, status, humanApprovalRequired]
      properties:
        id:
          type: string
        target:
          $ref: "#/components/schemas/RepositoryTarget"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/PatchOperation"
        status:
          type: string
          enum: [draft, ready, applied, partially-applied, failed, reverted]
        humanApprovalRequired:
          type: boolean
    Approval:
      type: object
      required: [proposalId, decidedBy, decision, decidedAt]
      properties:
        proposalId:
          type: string
        decidedBy:
          type: string
          enum: [human, system]
        decision:
          type: string
          enum: [approved, rejected, deferred]
        reason:
          type: string
        decidedAt:
          type: string
          format: date-time
    BoundedRetryResult:
      type: object
      required: [success, attempts, finalStatus, summary]
      properties:
        success:
          type: boolean
        attempts:
          type: integer
          minimum: 0
        finalStatus:
          type: string
          enum: [applied, no-op, failed, reverted, revert-failed]
        summary:
          type: string
    RepairRun:
      type: object
      required:
        - id
        - status
        - createdAt
        - updatedAt
        - request
        - target
        - issues
        - proposal
        - approval
        - result
        - explorerIterations
        - stopped
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            [
              diagnosing,
              awaiting-approval,
              running,
              completed,
              rejected,
              failed,
            ]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        request:
          $ref: "#/components/schemas/RepairRequestSnapshot"
        target:
          $ref: "#/components/schemas/RepositoryTarget"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosisIssue"
        proposal:
          oneOf:
            - $ref: "#/components/schemas/PatchProposal"
            - type: "null"
        approval:
          oneOf:
            - $ref: "#/components/schemas/Approval"
            - type: "null"
        result:
          oneOf:
            - $ref: "#/components/schemas/BoundedRetryResult"
            - type: "null"
        explorerIterations:
          type: integer
          minimum: 0
        stopped:
          type: string
          enum: [max-iterations, done, error]
        error:
          type: string
    RepairRequestSnapshot:
      type: object
      required:
        [issueDescription, rootPath, allowlist, backend, maxRetries, dryRun]
      properties:
        issueDescription:
          type: string
        rootPath:
          type: string
        allowlist:
          type: array
          items:
            type: string
        backend:
          type: string
          enum: [fake, openai]
        maxRetries:
          type: integer
        dryRun:
          type: boolean
    RepairListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RepairRun"
        total:
          type: integer
          minimum: 0
