services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - REPOMEDIC_REPO_ROOT=/workspace/repository
      - REPOMEDIC_DATA_DIR=/workspace/repository/.repomedic/docker
      - CORS_ORIGIN=http://localhost:${REPOMEDIC_LOCAL_WEB_PORT:-3000}
      - REPOMEDIC_API_TOKEN=${REPOMEDIC_API_TOKEN:-}
    volumes:
      - .:/workspace/repository
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - repomedic

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_REPOMEDIC_API_URL: http://localhost:${REPOMEDIC_LOCAL_API_PORT:-4000}
        NEXT_PUBLIC_REPOMEDIC_API_TOKEN: ${REPOMEDIC_API_TOKEN:-}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - repomedic

networks:
  repomedic:
    driver: bridge
