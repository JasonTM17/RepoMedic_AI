version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
    restart: unless-stopped

  web:
    image: node:22-alpine
    working_dir: /app/apps/web
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - ../../:/app
    command: npm run dev
    depends_on:
      - api
