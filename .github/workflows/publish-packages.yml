name: Publish Packages

# Release procedure:
#   1. Bump the `version` field in the package(s) being released under
#      `packages/*/package.json`. Commit that change on `main`.
#   2. Create and push a tag matching `v*` (e.g. `git tag v0.2.0 && git push
#      origin v0.2.0`) — this triggers the workflow below.
#   3. Alternatively, run this workflow manually via `workflow_dispatch` with
#      `release_tag` set to an existing tag pointing at the checked-out commit
#      (for example to retry a partially failed release). Each publish step
#      checks whether that package's current version already exists on GitHub
#      Packages and skips it if so, so re-running is safe.
#   4. Packages are independent — none of the four declares a dependency on
#      another @jasonTM17 package — so there is no required publish order and
#      a partial failure does not block the others from publishing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag pointing at the checked-out commit"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: "@jasonTM17"

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        run: node scripts/validate-release-tag.mjs
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

      - name: Verify generated API client
        run: npm run generate:api-client

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Build packages
        run: npm run build:core && npm run build:fs-guard && npm run build:exec-guard && npm run build:api-client

      - name: Run tests
        run: npm test

      - name: Validate package archives
        run: npm run package:check

      # Each package is published independently: none of the four declares a
      # dependency on another @jasonTM17 package, so there is no required
      # publish order. A version check keeps re-running this workflow (e.g. a
      # re-tagged release, or workflow_dispatch after a partial failure) from
      # hard-failing on packages whose version was already published.
      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail

          publish_package() {
            local package_name="$1"
            local workspace="$2"
            local version
            local encoded_name
            local http_status

            version=$(node -p "require('./${workspace}/package.json').version")
            encoded_name=$(node -p 'encodeURIComponent(process.argv[1])' "$package_name")
            http_status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${NODE_AUTH_TOKEN}" \
              "https://npm.pkg.github.com/${encoded_name}/${version}" || true)

            if [ "$http_status" = "200" ]; then
              echo "${package_name}@${version} already published; skipping"
              return 0
            fi

            if [ "$http_status" = "404" ]; then
              if ! npm publish "--workspace=${workspace}" --registry=https://npm.pkg.github.com/; then
                echo "Publishing ${package_name}@${version} failed." >&2
                return 1
              fi
              return 0
            fi

            echo "Unable to check ${package_name}@${version} on GitHub Packages (HTTP ${http_status:-unknown})." >&2
            return 1
          }

          failures=0
          while IFS='|' read -r package_name workspace; do
            if publish_package "$package_name" "$workspace"; then
              :
            else
              failures=$((failures + 1))
            fi
          done <<'PACKAGES'
          @jasonTM17/core|packages/core
          @jasonTM17/fs-guard|packages/fs-guard
          @jasonTM17/exec-guard|packages/exec-guard
          @jasonTM17/api-client|packages/api-client
          PACKAGES

          if [ "$failures" -gt 0 ]; then
            echo "${failures} package publication(s) failed." >&2
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
