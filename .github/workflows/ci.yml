name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-lint:
    name: ci/build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run generate:api-client
      - uses: gitleaks/gitleaks-action@v3
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: "1"

  docker-build:
    name: ci/docker-build
    needs: build-test-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web, cli]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          load: true
          push: false
          tags: repomedic/${{ matrix.service }}:ci
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: repomedic/${{ matrix.service }}:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
